[package]
name = "game_memory_tool"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An unsafe crate, a personal-use crate, made just for convenience, only supports Windows, only for manipulating single-player game processes, the code is very unsafe. If you cargo add this crate, it is recommended to use it only in completely single-player games."

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
] 

[dependencies.windows-result]
version = "0.4"
